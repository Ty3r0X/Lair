 name: Build and push container image

 on:
   push:
     branches:
       - master
   workflow_dispatch:

 jobs:
   build:
     runs-on: codeberg-tiny-lazy
     env:
       IMAGE_NAME: codeberg.org/ty3r0x/lair
     steps:
       - name: Checkout
         uses: https://code.forgejo.org/actions/checkout@v4

       - name: Install buildah
         run: apt-get update -qq && apt-get install -y buildah ca-certificates

       - name: Build image
         run: |
           buildah build \
             --storage-driver=vfs \
             --isolation=chroot \
             --file Containerfile \
             --tag ${{ env.IMAGE_NAME }}:latest \
             .

       - name: Push image
         run: |
           buildah push \
             --storage-driver=vfs \
             --creds ${{ github.actor }}:${{ secrets.REGISTRY_TOKEN }} \
             ${{ env.IMAGE_NAME }}:latest
